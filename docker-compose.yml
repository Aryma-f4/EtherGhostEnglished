version: '3.8'

services:
  etherghost:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - 'ETHER_GHOST_SECRET=${ETHER_GHOST_SECRET:-please-change-me}'
      - 'ETHER_GHOST_AUTH_USERNAME=${ETHER_GHOST_AUTH_USERNAME:-admin}'
      - 'ETHER_GHOST_AUTH_PASSWORD=${ETHER_GHOST_AUTH_PASSWORD:-}'
      - 'COOKIE_SECURE=${COOKIE_SECURE:-false}'
    ports:
      - '8022:8022'
      - '4440-4946:4440-4946'   # Port range for reverse shells
    restart: unless-stopped
    volumes:
      - 'etherghost_data:/root/.local/share/EtherGhost'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8022/utils/version']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - coolify    # Attach to Coolify's network so Traefik can reach the container
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.etherghost.rule=Host(`ghost.pengangguran.team`)'
      - 'traefik.http.services.etherghost.loadbalancer.server.port=8022'
      - 'traefik.http.routers.etherghost.entrypoints=websecure'   # Use HTTPS
      - 'traefik.http.routers.etherghost.tls.certresolver=letsencrypt'  # Auto SSL

volumes:
  etherghost_data:

networks:
  coolify:
    external: true   # Assumes Coolify's network already exists (usually named 'coolify')